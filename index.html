<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KalenderTidrapport</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f5f7fb;
        color: #1f2937;
      }
      nav {
        display: flex;
        gap: 6px;
        background: #fff;
        border-bottom: 1px solid #dbe1ea;
        padding: 10px 16px;
      }
      nav button {
        font-size: 14px;
        padding: 8px 14px;
        border-radius: 8px;
        border: 1px solid #cbd5e1;
        background: #fff;
        color: #1f2937;
        cursor: pointer;
      }
      nav button.active {
        background: #1d4ed8;
        color: #fff;
        border-color: #1d4ed8;
      }
      .pages {
        flex: 1;
        position: relative;
      }
      .page {
        position: absolute;
        inset: 0;
        display: none;
      }
      .page.active {
        display: block;
      }
      iframe {
        width: 100%;
        height: 100%;
        border: 0;
      }
    </style>
  </head>
  <body>
    <nav>
      <button id="menuTidrapport" type="button" class="active">Tidrapport</button>
      <button id="menuBokio" type="button">Bokiofaktura</button>
    </nav>

    <div class="pages">
      <div id="pageTidrapport" class="page active">
        <iframe
          src="Javascript/tidrapport-export/index.html"
          title="Tidrapport-export"
          loading="lazy"
        ></iframe>
      </div>
      <div id="pageBokio" class="page">
        <iframe
          src="Javascript/bokiofaktura-tidrapport-gcal-outlook/index.html"
          title="Bokiofaktura med Tidrapport GCAL/Outlook"
          loading="lazy"
        ></iframe>
      </div>
    </div>

    <script>
      (function () {
        const menuTidrapport = document.getElementById("menuTidrapport");
        const menuBokio = document.getElementById("menuBokio");
        const pageTidrapport = document.getElementById("pageTidrapport");
        const pageBokio = document.getElementById("pageBokio");

        function showPage(name) {
          const isTidrapport = name === "tidrapport";
          menuTidrapport.classList.toggle("active", isTidrapport);
          menuBokio.classList.toggle("active", !isTidrapport);
          pageTidrapport.classList.toggle("active", isTidrapport);
          pageBokio.classList.toggle("active", !isTidrapport);
        }

        menuTidrapport.addEventListener("click", () => showPage("tidrapport"));
        menuBokio.addEventListener("click", () => showPage("bokio"));
      })();
    </script>
  </body>
</html>
